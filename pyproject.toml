[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fedtext"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "fredapi>=0.5",
    "numpy>=1.26",
    "pandas>=2.2",
    "requests>=2.31",
    "scikit-learn>=1.4",
    "pyarrow>=23.0",
    "statsmodels>=0.14",
    "streamlit>=1.39",
]

[tool.setuptools.packages.find]
where = ["src"]
